{% extends "StudioUpload.html"%}
{%block body%}

<div class="upload_pop_up">
    <nav class="content_Type">
        <ul>
            <h3>FeedbackUploader</h3>
        </ul>
 </nav>
 <div class="close">
    <a href="/studios"><H2 style="margin: 0;">+</H2></a>
 </div>
 <!--VideoUpload-->
 <div class="VUpload">
    <form action="/uploading" enctype="multipart/form-data" method="post">
        <div id="content-preview"></div>
        <div id="V-content"></div>
        <div class="content">
            <label for="thumbnail">
                <img src="{{url_for('static',filename='img/input box.webp')}}" title="Add a thumble">
            </label>
            <input type="file" id="thumbnail" name="Thumbnail" accept="image/*">
            <div class="video" id="video">
                <input type="file" id="Video" name="Video" accept="video/*">
                <label for="Video">
                    <p style="color: white;">Enter your Video Content</p>
                </label>
            </div>
        </div>
        <div class="title">
            <textarea name="title" id="title" cols="2" rows="2" placeholder="Enter a title for your video (required)"></textarea>
        </div>
        <div class="much_info">
            <h3>Pros</h3>
            <textarea name="Pros" id="title" cols="42" rows="5" style="resize: none; font-family: Arial, Helvetica, sans-serif;" placeholder="Please use bullats for to the point feedback"></textarea>
            
            <div class="Cons">
                <h3 style="margin-bottom: 5px;">Cons</h3>
                <textarea name="Cons" id="title" cols="41" rows="5" style="resize: none; font-family: Arial, Helvetica, sans-serif;" placeholder="Please use bullats for to the point feedback"></textarea>
            </div>
            <div class="Cons">
                <h3 style="margin-bottom: 5px;">Catagory</h3>
                <textarea name="Catagory" id="title" cols="41" rows="5" style="resize: none; font-family: Arial, Helvetica, sans-serif;" placeholder="use'/'between the each type for better suggetion"></textarea>
            </div>
            <div class="age restictions">   <!--this is not for age restriction, But for Css this class named as A_Restriction-->
                 <h3 style="margin-bottom: 5px;">Value</h3>
                 <input type="radio" name="PurchesValue" value="0.08">0.08 eth<br>
                 <input type="radio" name="PurchesValue" value="0.09">0.09 eth<br>
                 <input type="radio" name="PurchesValue" value="0.10">0.10 eth<br>
                 <input type="radio" name="PurchesValue" value="0.11">0.11 eth<br>
                 <input type="radio" name="PurchesValue" value="0.13">0.13 eth<br>
                 <input type="radio" name="PurchesValue" value="0.14">0.14 eth<br>
                 <input type="radio" name="PurchesValue" value="0.16">0.16 eth<br>
                 <input type="radio" name="PurchesValue" value="0.20">0.20 eth<br>
                 <input type="radio" name="PurchesValue" value="0.25">0.25 eth<br>
                 <input type="radio" name="PurchesValue" value="0.30">0.30 eth<br>
                 <input type="radio" name="PurchesValue" value="0.50">0.50 eth
            </div>
            <div class="suggations">
                <div id="TrailerC" style="height: auto;margin: 10px; padding:5px;width: 5cm;border-radius: 50px;background-color: rgb(0, 119, 255);">
                    <input type="file" id="Trailer" name="TrailerV" onchange="changeBackground()" accept="video/*" style="display: none;">
                    <label for="Trailer" id="LbT">
                        <p id="TrailerPW" style="color: white;height: auto; width: auto;margin: 0;text-align: center;">enter a trailer here</p>
                        <p id="TrailerW" style="color: white;height: 0; width: auto;margin: 0;text-align: center;">Trailer</p>
                    </label>
                </div>
            </div>
        </div>
        <button type="submit"><p style="margin: 0;color: white;">lunch</p></button>
    </form>
 </div>
</div>
<script>
    function hideElementsAndShowProgress() {
      // Hide the required elements
      document.querySelector('.VUpload').style.display = 'none';
      document.querySelector('.content_Type').style.display = 'none';
      document.querySelector('.close').style.display = 'none';
  
      // Display the circular progress bar
      var progressBar = document.createElement('div');
      progressBar.className = 'progress-bar';
      progressBar.innerHTML = `
        <div class="progress-circle">
          <div class="progress-text">0%</div>
        </div>
      `;
      document.querySelector('.upload_pop_up').appendChild(progressBar);
  
      var percentage = 0;
      var progressText = progressBar.querySelector('.progress-text');
      var progressCircle = progressBar.querySelector('.progress-circle');
  
      function updateProgress() {
        percentage++;
        if (percentage <= 100) {
          progressText.textContent = percentage + '%';
          progressCircle.style.transform = `rotate(${percentage * 3.6}deg)`;
          setTimeout(updateProgress, 10); // Change the duration of each increment here
        }
      }
  
      updateProgress();
    }
  
    document.addEventListener('DOMContentLoaded', function() {
      // Attach the event listener to the lunch button
      var lunchButton = document.querySelector('button[type="submit"]');
      lunchButton.addEventListener('click', function(event) {
        event.preventDefault(); // Prevent form submission
        hideElementsAndShowProgress();
        // Submit the form after hiding the elements
        this.closest('form').submit();
      });
    });
  </script>
  
{%endblock%}
